<script>
const {groups,items,topics,tagLanguage}=JSON.parse(document.querySelector('#catalog').textContent);
const topicInfo=Object.assign(Object.create(null),topics);
const selected=new Set();
const byId=id=>document.getElementById(id);
const grid=byId('grid');
const detail=byId('detail');
const external=byId('external');
let visibleItems=[];
let detailItems=[];
let detailIndex=-1;
const counts=new Map();
for(const item of items) for(const tag of item.tags) counts.set(tag,(counts.get(tag)||0)+1);
const make=(tag,content='',className='')=>{
 const node=document.createElement(tag);
 node.textContent=content;
 if(className) node.className=className;
 return node;
};
function link(text,url){
 const a=make('a',text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;
}
function change(tag){
 if(selected.has(tag)) selected.delete(tag);else selected.add(tag);
 render();
}
function chip(tag,showCount=false){
 const info=topicInfo[tag];
 const label=Object.hasOwn(groups,tag)?groups[tag]:info?.[0]||tag;
 const node=make('button','#'+label,'chip');
 node.type='button';node.dataset.tag=tag;
 node.title=info?.[0]||groups[tag];
 if(info) node.style.setProperty('--chip',info[1]);
 if(showCount) node.append(make('span',String(counts.get(tag)||0)));
 node.setAttribute('aria-pressed',String(selected.has(tag)));
 node.addEventListener('click',()=>change(tag));
 return node;
}
function imageCandidates(item){
 const original=new URL(item.image,document.baseURI);
 const variants=[original.href];
 const sized=/^\/c\/\d+x\d+[^/]*\//;
 if(original.hostname==='booth.pximg.net' && sized.test(original.pathname)){
  const full=new URL(original);full.pathname=full.pathname.replace(sized,'/');variants.unshift(full.href);
 }
 if(original.hostname==='precious.ismcdn.jp' && original.pathname.includes('/720mw/')){
  const small=new URL(original);small.pathname=small.pathname.replace('/720mw/','/226/');variants.push(small.href);
 }
 if(original.search && ['images.oceans.tokyo.jp','cdn-fastly.upstyledaily.com','cdn.myportfolio.com','storagefiles.clo-set.com'].includes(original.hostname)){
  const full=new URL(original);full.search='';variants.push(full.href);
 }
 return [...new Set(variants)];
}
function thumbnailCandidates(item){
 const original=new URL(item.image);
 const thumb=new URL(original);
 if(thumb.hostname==='precious.ismcdn.jp'){
  thumb.pathname=thumb.pathname.replace('/720mw/','/226/');
 }else if(thumb.hostname==='images.pexels.com'){
  thumb.searchParams.set('w','360');
 }else if(thumb.hostname==='images.oceans.tokyo.jp'&&thumb.searchParams.has('h')){
  thumb.searchParams.set('h','400');
 }
 return [...new Set([thumb.href,...imageCandidates(item)])];
}
function addImage(container,item,className=''){
 const preview=className==='preview';
 const candidates=preview?imageCandidates(item):thumbnailCandidates(item);
 const image=make('img','',className);
 image.alt=item.title;
 image.decoding='async';
 if(!preview) image.fetchPriority='low';
 let attempt=0;
 image.addEventListener('error',()=>{
  if(!image.isConnected)return;
  attempt++;
  if(attempt<candidates.length){
   image.src=candidates[attempt];
   return;
  }
  image.remove();
  const retry=make('button','画像を再試行','minor');
  retry.type='button';
  retry.addEventListener('click',()=>{
   retry.remove();
   addImage(container,item,className);
  });
  if(className==='preview'){
   container.replaceChildren(make('p','画像を読み込めませんでした。元画像を別タブで開けます。','media-status'),retry);
  }
 });
 container.append(image);
 image.src=candidates[0];
}
const detailMedia=byId('detail-media');
let zoom=1;
let fitWidth=0;
let fitHeight=0;
let pan=null;
function stopPan(){
 if(!pan)return;
 const {pointerId}=pan;
 pan=null;
 delete detailMedia.dataset.panning;
 if(detailMedia.hasPointerCapture(pointerId))detailMedia.releasePointerCapture(pointerId);
}
detailMedia.addEventListener('pointerdown',event=>{
 if(pan||event.button!==0||!event.target.matches('.preview[data-zoomed]'))return;
 event.preventDefault();
 detailMedia.setPointerCapture(event.pointerId);
 pan={pointerId:event.pointerId,x:event.clientX,y:event.clientY,left:detailMedia.scrollLeft,top:detailMedia.scrollTop};
 detailMedia.dataset.panning='';
});
detailMedia.addEventListener('pointermove',event=>{
 if(pan?.pointerId!==event.pointerId)return;
 detailMedia.scrollLeft=pan.left+pan.x-event.clientX;
 detailMedia.scrollTop=pan.top+pan.y-event.clientY;
});
for(const type of ['pointerup','pointercancel','lostpointercapture']){
 detailMedia.addEventListener(type,event=>{
  if(pan?.pointerId===event.pointerId)stopPan();
 });
}
detailMedia.addEventListener('dragstart',event=>{
 if(event.target.matches('.preview'))event.preventDefault();
});
detail.addEventListener('close',stopPan);
function isBackdrop(event){
 if(event.target!==detail)return false;
 const rect=detail.getBoundingClientRect();
 return event.clientX<rect.left||event.clientX>=rect.right||event.clientY<rect.top||event.clientY>=rect.bottom;
}
let backdropPress=false;
detail.addEventListener('pointerdown',event=>{
 backdropPress=event.button===0&&isBackdrop(event);
});
detail.addEventListener('pointercancel',()=>{backdropPress=false});
detail.addEventListener('click',event=>{
 if(backdropPress&&isBackdrop(event))detail.close();
 backdropPress=false;
});

detailMedia.addEventListener('wheel',event=>{
 const image=detailMedia.querySelector('.preview');
 if(event.target!==image||!image.naturalWidth||!event.deltaY)return;
 event.preventDefault();
 const nextZoom=Math.max(1,Math.min(5,zoom*(event.deltaY<0?1.2:1/1.2)));
 if(Math.abs(nextZoom-zoom)<0.001)return;
 const rect=image.getBoundingClientRect();
 const x=(event.clientX-rect.left)/rect.width;
 const y=(event.clientY-rect.top)/rect.height;
 if(zoom===1){fitWidth=rect.width;fitHeight=rect.height;}
 stopPan();
 zoom=nextZoom;
 if(zoom===1){
  delete image.dataset.zoomed;
  image.style.removeProperty('width');image.style.removeProperty('height');
  detailMedia.scrollTo(0,0);
  return;
 }
 image.dataset.zoomed='';
 image.style.width=(fitWidth*zoom)+'px';
 image.style.height=(fitHeight*zoom)+'px';
 const moved=image.getBoundingClientRect();
 detailMedia.scrollLeft+=moved.left+x*moved.width-event.clientX;
 detailMedia.scrollTop+=moved.top+y*moved.height-event.clientY;
},{passive:false});
function openDetail(item){
 detailItems=visibleItems.filter(entry=>entry.image||entry.id===item.id);
 detailIndex=detailItems.findIndex(entry=>entry.id===item.id);
 showDetail();
 detail.showModal();
}
function showDetail(){
 const item=detailItems[detailIndex];
 byId('previous').disabled=detailIndex===0;
 byId('next').disabled=detailIndex===detailItems.length-1;
 byId('position').textContent=(detailIndex+1)+' / '+detailItems.length;

 byId('detail-title').textContent=item.title;
 byId('detail-note').textContent=item.note;
 const media=detailMedia;
 stopPan();
 zoom=1;
 media.replaceChildren();
 media.scrollTo(0,0);
 if(item.image && external.checked) addImage(media,item,'preview');
 else media.append(make('p',item.image?'画像プレビュー表示はオフです。':'画像や動画は出典ページで閲覧できます。'));
 const links=byId('detail-links');
 links.replaceChildren(link('出典ページ ↗',item.source));
 if(item.image){
  const original=imageCandidates(item)[0];
  links.append(link('元画像を開く ↗',original));
  if(original!==new URL(item.image,document.baseURI).href)links.append(link('掲載サムネイル ↗',item.image));
 }
 if(item.alternateSource) links.append(link('別掲載ページ ↗',item.alternateSource));
 const tags=byId('detail-tags');tags.replaceChildren(...item.tags.map(tag=>chip(tag)));
}
function navigate(step){
 const index=detailIndex+step;
 if(index<0||index>=detailItems.length)return;
 detailIndex=index;
 showDetail();
}
byId('previous').addEventListener('click',()=>navigate(-1));
byId('next').addEventListener('click',()=>navigate(1));
detail.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||!['ArrowLeft','ArrowRight'].includes(event.key))return;
 event.preventDefault();
 navigate(event.key==='ArrowLeft'?-1:1);
});
const cards=new Map();
function loadThumbnail(thumb){
 const item=cards.get(thumb.closest('article').dataset.item)?.item;
 if(external.checked&&item?.image&&!thumb.querySelector('img'))addImage(thumb,item);
}
const nearViewport=new IntersectionObserver(entries=>{
 for(const entry of entries){
  if(!entry.isIntersecting)continue;
  nearViewport.unobserve(entry.target);
  loadThumbnail(entry.target);
 }
},{rootMargin:'650px 0px'});
function card(item){
 const article=make('article','','tile');
 article.dataset.item=item.id;
 const thumb=make('button','','thumb');thumb.type='button';thumb.setAttribute('aria-label',item.title+'の詳細');
 const fallback=make('span','','placeholder');
 fallback.append(make('strong',item.title),make('small',item.image&&external.checked?'出典の外部画像 ↗':'出典を参照 ↗'));
 thumb.append(fallback);
 thumb.addEventListener('click',()=>openDetail(item));
 article.append(thumb,make('h2',item.title));
 return {article,thumb,item};
}
function render(){
 const matches=items.filter(item=>[...selected].every(tag=>item.tags.includes(tag)));
 visibleItems=matches;
 const matching=new Set(matches.map(item=>item.id));
 for(const [id,{article,thumb,item}] of cards){
  article.hidden=!matching.has(id);
  if(!item.image)continue;
  if(!external.checked){
   nearViewport.unobserve(thumb);
   thumb.querySelector('img')?.remove();
  }else if(!article.hidden&&!thumb.querySelector('img')){
   nearViewport.observe(thumb);
  }else if(article.hidden){
   nearViewport.unobserve(thumb);
  }
 }
 const groupCount=new Set(matches.map(item=>item.group)).size;
 byId('count').textContent=matches.length+' 件 / '+items.length+' 件 · '+groupCount+' グループ';
 byId('empty').hidden=matches.length!==0;
 byId('reset').disabled=selected.size===0;
 for(const button of document.querySelectorAll('button[data-tag]')) button.setAttribute('aria-pressed',String(selected.has(button.dataset.tag)));
}
byId('topics').append(...['front','side','back',...Object.keys(topicInfo).filter(tag=>!['front','side','back'].includes(tag))].filter(tag=>counts.has(tag)).map(tag=>chip(tag,true)));
byId('outfits').append(...Object.keys(groups).map(tag=>chip(tag,true)));
byId('reset').addEventListener('click',()=>{selected.clear();render();});
external.addEventListener('change',render);
const initialCards=document.createDocumentFragment();
for(const item of items){
 const entry=card(item);
 cards.set(item.id,entry);
 initialCards.append(entry.article);
}
grid.append(initialCards);
render();
</script>
</body>
